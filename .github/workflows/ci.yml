name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests -q --ignore=tests/test_pdf_collector.py --ignore=tests/llm_depth_test.py

      - name: Run core algorithm offline acceptance
        run: python evals/core-algorithms/run_offline_eval.py --compact

      - name: Lint
        run: python -m ruff check sheaf_ai sheaf_cards tests scripts/smoke-pre-release.py scripts/release evals/evidence-governed-memory evals/core-algorithms

      - name: Build check
        run: python -m build

      - name: Fresh wheel smoke
        if: matrix.python-version == '3.11'
        shell: bash
        run: |
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          python scripts/release/smoke_fresh_wheel.py --wheel "$wheel"
