name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Verify tag matches project version
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import tomllib

          tag = os.environ["GITHUB_REF_NAME"]
          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          expected_tag = f"v{version}"
          if tag != expected_tag:
              raise SystemExit(f"Release tag {tag!r} does not match pyproject version {version!r}; expected {expected_tag!r}")
          print(f"Release identity verified: {tag} == pyproject {version}")
          PY

      - name: Verify tagged commit belongs to main
        shell: bash
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tagged commit $GITHUB_SHA is not reachable from origin/main."
            exit 1
          fi

      - name: Run tests
        run: python -m pytest tests -q --basetemp .pytest-tmp-publish

      - name: Run evidence executor acceptance
        run: python evals/evidence-governed-memory/run_executor_acceptance.py --compact

      - name: Run lint
        run: python -m ruff check sheaf_ai sheaf_cards tests scripts/smoke-pre-release.py scripts/release evals/evidence-governed-memory

      - name: Build package
        run: python -m build

      - name: Smoke-test fresh wheel install
        shell: bash
        run: |
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          python scripts/release/smoke_fresh_wheel.py \
            --wheel "$wheel" \
            --expected-version "${GITHUB_REF_NAME#v}"

      - name: Store verified distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sheaf-ai
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
